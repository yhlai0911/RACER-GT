[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "racergt"
version = "0.3.0"
description = "Randomized Acquisition, Calibration, Error Decomposition, and Reconstruction for Google Trends"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{name = "Yi-Hao Lai research group"}]
keywords = ["Google Trends", "measurement error", "generalizability theory", "graph calibration", "GLS", "econometrics"]
dependencies = ["numpy>=1.24", "pandas>=2.0", "scipy>=1.10", "statsmodels>=0.14", "scikit-learn>=1.3", "networkx>=3.0", "matplotlib>=3.7", "PyYAML>=6.0"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6", "build>=1.2"]
collect = ["playwright>=1.45"]

[project.scripts]
racergt = "racergt.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
