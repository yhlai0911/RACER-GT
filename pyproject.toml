[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "racergt"
version = "1.2.0"
description = "Randomized acquisition, calibration, error decomposition, and reliability analysis for long-horizon Google Trends data"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  {name = "Yi-Hao Lai and RACER-GT contributors"}
]
keywords = ["Google Trends", "measurement error", "generalizability theory", "temporal benchmarking", "econometrics"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = [
  "numpy>=1.26",
  "pandas>=2.0",
  "scipy>=1.11",
  "statsmodels>=0.14",
  "networkx>=3.0",
  "pydantic>=2.5",
  "PyYAML>=6.0",
  "typer>=0.12",
  "rich>=13.0",
  "matplotlib>=3.8",
  "scikit-learn>=1.3",
  "jinja2>=3.1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "build>=1.2",
  "ruff>=0.6",
]

[project.scripts]
racergt = "racergt.cli:app"


[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py310"

# The rule set is pinned explicitly so that a future ruff release cannot turn CI
# red by widening its defaults. Add rules deliberately, never implicitly.
[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "RUF"]
ignore = [
  "E501",    # line length is enforced by the formatter, not the linter
  "B008",    # typer requires function calls (Argument/Option) in defaults
  "RUF001",  # docstrings legitimately mix CJK and ASCII punctuation
  "RUF002",
  "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]
# report.py embeds a Markdown template in a raw string. Two trailing spaces are a
# Markdown hard line break, so stripping them would silently reflow the generated
# diagnostic report.
"src/racergt/report.py" = ["W291"]
